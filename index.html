<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Digital Kozdra Verse for active projects, links, and archived portfolio content." />
		<title>Digital Kozdra Verse</title>
		<link rel="icon" href="oldSite/images/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" href="oldSite/images/favicon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
		<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
		<style>
			:root {
				--paper: #f4f1e8;
				--ink: #162028;
				--muted: #4d5b64;
				--panel: #fffdf8;
				--line: #d0d8de;
				--brand: #0f4c81;
				--brand-soft: #d9e7f3;
				--accent: #e27d3e;
				--shadow: 0 14px 30px rgba(15, 29, 40, 0.12);
			}
			* { box-sizing: border-box; }

			html, body {
				margin: 0;
				padding: 0;
				font-family: "Manrope", sans-serif;
				color: var(--ink);
				background:
					repeating-linear-gradient(-45deg, rgba(15,76,129,0.04), rgba(15,76,129,0.04) 14px, transparent 14px, transparent 28px),
					var(--paper);
			}

			/* ── Full-viewport graph ── */
			#graph-wrap {
				position: relative;
				width: 100%;
				height: 100svh;
				min-height: 500px;
			}

			#graph-canvas {
				display: block;
				width: 100%;
				height: 100%;
				cursor: grab;
			}
			#graph-canvas:active { cursor: grabbing; }

			/* HUD overlay */
			.hud {
				position: absolute;
				top: 1rem;
				left: 1rem;
				display: flex;
				flex-direction: column;
				gap: 0.45rem;
				pointer-events: none;
				z-index: 10;
			}
			.hud-title {
				font-family: "Barlow Condensed", sans-serif;
				font-size: clamp(1.4rem, 3vw, 2.2rem);
				font-weight: 700;
				letter-spacing: 0.04em;
				color: var(--ink);
				line-height: 1;
			}
			.hud-sub {
				font-size: 0.75rem;
				color: var(--muted);
			}

			.hud-btn {
				pointer-events: all;
				display: inline-flex;
				align-items: center;
				gap: 0.4rem;
				margin-top: 0.3rem;
				text-decoration: none;
				font-weight: 700;
				font-size: 0.82rem;
				color: white;
				background: var(--brand);
				padding: 0.55rem 0.85rem;
				border-radius: 0.6rem;
				box-shadow: 0 8px 16px rgba(15,76,129,0.3);
				transition: transform 0.18s;
				width: fit-content;
			}
			.hud-btn:hover { transform: translateY(-2px); }

			.scroll-hint {
				position: absolute;
				bottom: 1.2rem;
				left: 50%;
				transform: translateX(-50%);
				font-size: 0.72rem;
				color: var(--muted);
				display: flex;
				align-items: center;
				gap: 0.35rem;
				pointer-events: none;
				z-index: 10;
				animation: fadeInUp 1.2s ease forwards;
			}
			@keyframes fadeInUp {
				from { opacity: 0; transform: translateX(-50%) translateY(8px); }
				to   { opacity: 1; transform: translateX(-50%) translateY(0); }
			}

			/* Legend */
			.legend {
				position: absolute;
				bottom: 1rem;
				right: 1rem;
				display: flex;
				flex-wrap: wrap;
				gap: 0.35rem 0.55rem;
				justify-content: flex-end;
				max-width: 260px;
				pointer-events: none;
				z-index: 10;
			}
			.legend-item {
				display: flex;
				align-items: center;
				gap: 0.28rem;
				font-size: 0.68rem;
				color: var(--muted);
			}
			.legend-dot {
				width: 9px; height: 9px;
				border-radius: 50%;
				flex-shrink: 0;
			}

			/* Tooltip */
			#node-tooltip {
				position: fixed;
				pointer-events: none;
				background: var(--ink);
				color: #fff;
				border-radius: 10px;
				padding: 0.6rem 0.8rem;
				font-size: 0.78rem;
				line-height: 1.5;
				max-width: 230px;
				opacity: 0;
				transition: opacity 0.12s;
				z-index: 999;
				box-shadow: 0 6px 20px rgba(0,0,0,0.35);
			}
			#node-tooltip.visible { opacity: 1; }
			.tt-name {
				font-family: "Barlow Condensed", sans-serif;
				font-size: 1.05rem;
				font-weight: 700;
				letter-spacing: 0.04em;
			}
			.tt-tag {
				display: inline-block;
				font-size: 0.65rem;
				background: rgba(255,255,255,0.15);
				border-radius: 4px;
				padding: 0.1rem 0.3rem;
				margin-top: 0.2rem;
				text-transform: uppercase;
				letter-spacing: 0.07em;
			}
			.tt-desc { margin-top: 0.3rem; color: rgba(255,255,255,0.72); }
			.tt-url  { margin-top: 0.3rem; color: #7ec8f7; word-break: break-all; font-size: 0.7rem; }

			/* Below-fold content */
			.below {
				width: min(1050px, calc(100% - 2rem));
				margin: 0 auto;
				padding: 1.5rem 0 3rem;
				display: flex;
				flex-direction: column;
				gap: 1rem;
			}

			h2, h3 {
				font-family: "Barlow Condensed", sans-serif;
				letter-spacing: 0.03em;
				margin: 0;
			}
			h2 { font-size: clamp(1.5rem, 3vw, 2rem); }

			.section {
				padding: 1rem;
				border: 1px solid var(--line);
				background: var(--panel);
				border-radius: 16px;
				box-shadow: var(--shadow);
			}
			.legacy { border-left: 6px solid var(--accent); }

			.lead {
				margin: 0.5rem 0 0;
				color: var(--muted);
				max-width: 68ch;
			}
			.link {
				display: inline-block;
				margin-top: 0.5rem;
				color: var(--brand);
				font-weight: 700;
				text-underline-offset: 0.2rem;
			}

			.footer {
				text-align: center;
				font-size: 0.88rem;
				color: var(--muted);
				padding-top: 0.5rem;
			}

@media (max-width: 640px) {
				.legend { display: none; }
				.hud-title { font-size: 1.2rem; }
			}
		</style>
	</head>
	<body>

		<div id="node-tooltip">
			<div class="tt-name"  id="tt-name"></div>
			<div class="tt-tag"   id="tt-tag"></div>
			<div class="tt-desc"  id="tt-desc"></div>
			<div class="tt-url"   id="tt-url"></div>
		</div>

		<!-- Full-viewport graph -->
		<div id="graph-wrap">
			<canvas id="graph-canvas"></canvas>

			<div class="hud">
				<div class="hud-title">Digital Kozdra Verse</div>
				<div class="hud-sub">Drag nodes &bull; Click to open &bull; Scroll to zoom &bull; Drag canvas to pan</div>
				<a class="hud-btn" href="https://davidkozdra.com/" target="_blank" rel="noopener noreferrer">Go to davidkozdra.com ↗</a>
				<a class="hud-btn" href="/oldSite/" target="_blank" rel="noopener noreferrer">Go to old version of this page ↗</a>
			
            </div>

			<div class="scroll-hint">↓ scroll for more</div>

			<div class="legend" id="legend"></div>
		</div>

		<!-- Below-fold sections -->
		<div class="below">
			<section class="section legacy">
				<h2>Legacy Site</h2>
				<p class="lead">The original portfolio and archived pages are preserved here.</p>
				<a class="link" href="oldSite/index.html">Open oldSite archive</a>
			</section>
			<p class="footer">Digital Kozdra Verse</p>
		</div>

		<script>
		const CAT = {
			hub:       { r:[15,76,129],  s:[10,50,90],   label:"Hub"       },
			portfolio: { r:[14,120,87],  s:[8,80,58],    label:"Portfolio" },
			archive:   { r:[226,125,62], s:[180,95,40],  label:"Archive"   },
			social:    { r:[90,60,160],  s:[60,35,120],  label:"Social"    },
			web:       { r:[30,150,200], s:[15,110,160], label:"Web"       },
			desktop:   { r:[200,60,90],  s:[160,35,65],  label:"Desktop"   },
			mobile:    { r:[50,180,120], s:[25,140,85],  label:"Mobile"    },
			game:      { r:[200,160,20], s:[160,120,10], label:"Game"      },
		};

		const NODE_R = { hub:42, portfolio:32, archive:28, social:22, web:22, desktop:22, mobile:22, game:22 };

		// Build legend
		const legend = document.getElementById("legend");
		Object.entries(CAT).forEach(([k, v]) => {
			const d = document.createElement("div");
			d.className = "legend-item";
			d.innerHTML = `<div class="legend-dot" style="background:rgb(${v.r.join(",")})"></div>${v.label}`;
			legend.appendChild(d);
		});

		// ── Load graph data then start p5 ────────────────────────────────────────
		fetch("graph-data.json")
			.then(r => r.json())
			.then(GRAPH => startGraph(GRAPH))
			.catch(() => {
				// Fallback: empty graph with just the hub so page never breaks
				startGraph({ nodes: [{ id:"hub", label:"Digital Kozdra\nVerse", category:"hub", desc:"", url:"https://davidkozdra.github.io/", favId:"fav-hub" }], edges: [] });
			});

		function startGraph(GRAPH) {

		// ── p5 sketch ───────────────────────────────────────────────────────────
		new p5(function(p) {
			const wrapper = document.getElementById("graph-wrap");
			const canvas  = document.getElementById("graph-canvas");
			const tooltip = document.getElementById("node-tooltip");

			let nodes = [], edges = [];
			let favImgs = {};
			let dragging = null, dragOffX = 0, dragOffY = 0;
			let isPanning = false, panSX, panSY, camSX, camSY;
			let camX = 0, camY = 0, zoom = 1;
			let hoveredNode = null;
			let W, H;
			let settled = false;
			let frameCount = 0;

			p.setup = function() {
				W = wrapper.clientWidth;
				H = wrapper.clientHeight;
				const cnv = p.createCanvas(W, H, canvas);
				cnv.style("display","block");

				p.textFont("Manrope");
				p.imageMode(p.CENTER);
				p.noLoop();

				// Wrap a label so every line fits within maxW pixels at fontSize fs
				function wrapLabel(raw, r) {
					const maxW   = r * 1.55; // inscribed chord budget
					const words  = raw.replace(/\n/g, " ").trim().split(/\s+/);
					const fs     = Math.max(7, Math.min(13, r * 0.38));
					p.textSize(fs);
					const lines = [];
					let cur = "";
					for (const w of words) {
						const test = cur ? cur + " " + w : w;
						if (p.textWidth(test) <= maxW) { cur = test; }
						else { if (cur) lines.push(cur); cur = w; }
					}
					if (cur) lines.push(cur);
					return lines.length ? lines : [raw];
				}

				// Spawn nodes in rings
				GRAPH.nodes.forEach((nd, i) => {
					const isHub = nd.category === "hub";
					const angle = (i / GRAPH.nodes.length) * p.TWO_PI;
					const r = isHub ? 0 : 200 + Math.random() * 120;
					const radius = NODE_R[nd.category] || 22;
					nodes.push({
						...nd,
						lines: wrapLabel(nd.label, radius),
						radius,
						x: W/2 + Math.cos(angle) * r,
						y: H/2 + Math.sin(angle) * r,
						vx: 0, vy: 0,
					});
				});

				edges = GRAPH.edges.map(e => ({
					from: nodes.find(n=>n.id===e.f),
					to:   nodes.find(n=>n.id===e.g),
				})).filter(e=>e.from&&e.to);

				// Load favicons via fetch→blob so canvas drawImage never taints
				const favDomains = {
					"fav-hub":      "github.io",
					"fav-main":     "davidkozdra.com",
					"fav-linkedin": "linkedin.com",
					"fav-github":   "github.com",
					"fav-fnn":      "floridanationalnews.com",
					"fav-itchio":   "itch.io",
					"fav-gmail":    "gmail.com",
				};
				const blobCache = {};
				async function loadFavicon(favId) {
					if (blobCache[favId]) return blobCache[favId];
					const domain = favDomains[favId];
					if (!domain) return null;
					try {
						const res = await fetch(`https://www.google.com/s2/favicons?sz=32&domain=${domain}`);
						if (!res.ok) return null;
						const blob = await res.blob();
						const url  = URL.createObjectURL(blob);
						const img  = new Image();
						await new Promise((ok, fail) => { img.onload = ok; img.onerror = fail; img.src = url; });
						blobCache[favId] = img;
						return img;
					} catch { return null; }
				}
				// Deduplicate favId → load once, assign to all nodes sharing it
				const uniqueFavIds = [...new Set(GRAPH.nodes.map(n => n.favId).filter(Boolean))];
				Promise.all(uniqueFavIds.map(async favId => {
					const img = await loadFavicon(favId);
					if (!img) return;
					GRAPH.nodes.forEach(nd => { if (nd.favId === favId) favImgs[nd.id] = img; });
					loop();
				}));

				// Scroll to zoom
				canvas.addEventListener("wheel", e => {
					e.preventDefault();
					const f = e.deltaY < 0 ? 1.1 : 0.91;
					const mx = e.offsetX, my = e.offsetY;
					camX = mx - (mx - camX) * f;
					camY = my - (my - camY) * f;
					zoom = p.constrain(zoom * f, 0.25, 4);
					loop();
				}, { passive: false });

				loop();
			};

			function loop() {
				if (!p._loop) p.loop();
				if (!settled) requestAnimationFrame(() => { if (frameCount > 280) { p.noLoop(); settled = true; } });
			}

			p.draw = function() {
				frameCount++;
				p.background(244, 241, 232); // --paper

				// Subtle grid pattern
				p.stroke(15,76,129,10);
				p.strokeWeight(1);
				const gs = 28;
				for (let x = ((camX%gs)+gs)%gs; x < W; x+=gs) p.line(x,0,x,H);
				for (let y = ((camY%gs)+gs)%gs; y < H; y+=gs) p.line(0,y,W,y);

				simulate();

				p.push();
				p.translate(camX, camY);
				p.scale(zoom);

				// Edges
				edges.forEach(e => {
					const c = CAT[e.from.category].r;
					p.stroke(c[0],c[1],c[2],55);
					p.strokeWeight(1.6/zoom);
					p.line(e.from.x, e.from.y, e.to.x, e.to.y);
				});

				// Nodes
				nodes.forEach(nd => drawNode(nd, nd===hoveredNode));

				p.pop();

				detectHover();

				// Stop loop once stable
				if (frameCount > 280 && !dragging && !isPanning) {
					p.noLoop();
					settled = true;
				}
			};

			function simulate() {
				const K_REP  = 12000;
				const K_ATT  = 0.0035;
				const REST   = 160;
				const DAMP   = 0.80;
				const PULL   = 0.0025;

				nodes.forEach(a => {
					nodes.forEach(b => {
						if (a===b) return;
						const dx=a.x-b.x, dy=a.y-b.y;
						const d2=dx*dx+dy*dy+1, d=Math.sqrt(d2);
						const f=K_REP/d2;
						a.vx+=(dx/d)*f; a.vy+=(dy/d)*f;
					});
					a.vx+=(W/2-a.x)*PULL;
					a.vy+=(H/2-a.y)*PULL;
				});

				edges.forEach(e => {
					const dx=e.to.x-e.from.x, dy=e.to.y-e.from.y;
					const d=Math.sqrt(dx*dx+dy*dy)+0.001;
					const f=(d-REST)*K_ATT;
					const fx=(dx/d)*f, fy=(dy/d)*f;
					e.from.vx+=fx; e.from.vy+=fy;
					e.to.vx-=fx;   e.to.vy-=fy;
				});

				nodes.forEach(nd => {
					if (nd===dragging) { nd.vx=0; nd.vy=0; return; }
					nd.vx*=DAMP; nd.vy*=DAMP;
					nd.x+=nd.vx; nd.y+=nd.vy;
				});
			}

			function drawNode(nd, hovered) {
				const col = CAT[nd.category];
				const r = nd.radius;
				const [fr,fg,fb] = col.r;
				const [sr,sg,sb] = col.s;

				if (hovered) {
					p.noStroke();
					p.fill(fr,fg,fb,35);
					p.ellipse(nd.x, nd.y, (r+16)*2, (r+16)*2);
				}

				// Shadow
				p.noStroke();
				p.fill(0,0,0,20);
				p.ellipse(nd.x+2, nd.y+5, r*2+4, r*2+4);

				// Body
				p.fill(fr,fg,fb);
				p.stroke(sr,sg,sb);
				p.strokeWeight(nd.category==="hub" ? 3.5/zoom : 1.8/zoom);
				p.ellipse(nd.x, nd.y, r*2, r*2);

				// Label — font sized to fit inside the circle
				const nLines = nd.lines.length;
				// budget: circle diameter * 0.55, split across lines + leading
				const fs = p.constrain((r * 0.42 / Math.max(nLines, 1)) / zoom, 5.5, 14);
				const lh = fs * 1.18;
				const totalH = nLines * lh;

				// Favicon (only if it fits above the text without leaving the circle)
				const fav = favImgs[nd.id];
				const favSize = Math.min(r * 0.5, 13);
				const hasRoom = fav && (totalH + favSize + 2) < r * 1.7;

				if (hasRoom) {
					const blockH  = favSize + 3 + totalH;
					const blockTop = nd.y - blockH / 2;
					p.noStroke();
					try { p.drawingContext.drawImage(fav, nd.x - favSize/2, blockTop, favSize, favSize); }
					catch(e) {}
					p.noStroke();
					p.fill(255);
					p.textAlign(p.CENTER, p.TOP);
					p.textSize(fs);
					p.textStyle(p.BOLD);
					const startY = blockTop + favSize + 3;
					nd.lines.forEach((ln, i) => p.text(ln, nd.x, startY + i * lh));
				} else {
					p.noStroke();
					p.fill(255);
					p.textAlign(p.CENTER, p.CENTER);
					p.textSize(fs);
					p.textStyle(p.BOLD);
					const startY = nd.y - (totalH / 2) + lh * 0.5;
					nd.lines.forEach((ln, i) => p.text(ln, nd.x, startY + i * lh));
				}
			}

			function s2w(sx, sy) { return { x:(sx-camX)/zoom, y:(sy-camY)/zoom }; }
			function w2s(wx, wy) { return { x:wx*zoom+camX,   y:wy*zoom+camY   }; }

			function nodeAt(sx, sy) {
				const w = s2w(sx,sy);
				for (let i=nodes.length-1;i>=0;i--) {
					const nd=nodes[i];
					const dx=w.x-nd.x, dy=w.y-nd.y;
					if (dx*dx+dy*dy < (nd.radius+8)*(nd.radius+8)) return nd;
				}
				return null;
			}

			function detectHover() {
				const hit = nodeAt(p.mouseX, p.mouseY);
				hoveredNode = hit;
				if (hit) {
					const s = w2s(hit.x, hit.y);
					showTip(hit, s.x, s.y);
				} else { hideTip(); }
			}

			function showTip(nd, sx, sy) {
				document.getElementById("tt-name").textContent = nd.label.replace("\n"," ");
				document.getElementById("tt-tag").textContent  = CAT[nd.category].label;
				document.getElementById("tt-desc").textContent = nd.desc||"";
				const urlEl = document.getElementById("tt-url");
				urlEl.textContent = nd.url && !nd.url.startsWith("mailto") ? nd.url : "";
				const rect = canvas.getBoundingClientRect();
				let tx = rect.left + sx + 16;
				let ty = rect.top  + sy - 12;
				if (tx + 240 > window.innerWidth)  tx = rect.left + sx - 248;
				if (ty + 160 > window.innerHeight) ty = window.innerHeight - 170;
				tooltip.style.left = tx+"px";
				tooltip.style.top  = ty+"px";
				tooltip.classList.add("visible");
			}
			function hideTip() { tooltip.classList.remove("visible"); }

			let _clickX, _clickY;

			p.mousePressed = function() {
				if (p.mouseX<0||p.mouseX>W||p.mouseY<0||p.mouseY>H) return;
				settled = false;
				_clickX = p.mouseX; _clickY = p.mouseY;
				const hit = nodeAt(p.mouseX, p.mouseY);
				if (hit) {
					dragging = hit;
					const w = s2w(p.mouseX, p.mouseY);
					dragOffX = hit.x - w.x;
					dragOffY = hit.y - w.y;
				} else {
					isPanning = true;
					panSX=p.mouseX; panSY=p.mouseY;
					camSX=camX; camSY=camY;
				}
				p.loop();
			};

			p.mouseDragged = function() {
				if (dragging) {
					const w = s2w(p.mouseX, p.mouseY);
					dragging.x = w.x + dragOffX;
					dragging.y = w.y + dragOffY;
					dragging.vx=0; dragging.vy=0;
				} else if (isPanning) {
					camX = camSX + (p.mouseX-panSX);
					camY = camSY + (p.mouseY-panSY);
				}
			};

			p.mouseReleased = function() {
				if (dragging) {
					const dx = p.mouseX-_clickX, dy = p.mouseY-_clickY;
					if (dx*dx+dy*dy < 36 && dragging.url) {
						if (dragging.url.startsWith("mailto")) {
							window.location.href = dragging.url;
						} else {
							window.open(dragging.url, "_blank", "noopener,noreferrer");
						}
					}
					dragging = null;
				}
				isPanning = false;
			};

			p.windowResized = function() {
				W = wrapper.clientWidth;
				H = wrapper.clientHeight;
				p.resizeCanvas(W, H);
				settled = false;
				p.loop();
			};

			// Touch support
			p.touchStarted  = function() { p.mousePressed();  return false; };
			p.touchMoved    = function() { p.mouseDragged();  return false; };
			p.touchEnded    = function() { p.mouseReleased(); return false; };
		});
		} // end startGraph
		</script>
	</body>
</html>
